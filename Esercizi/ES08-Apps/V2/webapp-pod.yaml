apiVersion: v1
kind: Pod
metadata:
  name: webapp-pod
  namespace: prj-antonio-minelli
  labels:
    app: web-app
spec:
  containers:
    - name: web-app
      image: docker.io/bmuschko/web-app:1.0.1
      envFrom:
      - configMapRef:
          name: db-config
      - secretRef:
          name: db-config-secret
      ports:
        - containerPort: 3000
          protocol: TCP